<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Products | Home Cake</title>

    <meta name="description" content="Browse our handmade cakes, cupcakes and celebration cakes." />

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="plp-body">
    <!-- =========================================
         HEADER
    ========================================== -->

    <div id="site-header"></div>

    <!-- =========================================
         MAIN
    ========================================== -->

    <main id="main-content">
      <section class="collection-hero" aria-labelledby="collection-title">
        <div class="collection-hero-content">
          <p class="collection-hero-eyebrow">Handcrafted</p>
          <h1 id="collection-title" class="collection-hero-title">Cakes</h1>
          <p class="collection-hero-subtitle">For Every Celebration</p>
          <a href="#products" class="hero-button collection-hero-button">
            Shop Cakes
            <img
              width="50px"
              src="/assets/images/button-rght-arrow.webp"
              alt="Button Click Right Arrow"
              loading="lazy"
              decoding="async"
            />
          </a>
        </div>
      </section>

      <section class="products-section products-plp" aria-labelledby="products-title">
        <div class="container">
          <div class="catalogue-layout">
            <aside class="filters-sidebar" aria-labelledby="filters-title">
              <div class="filters-sidebar__heading">
                <div>
                  <p class="filters-sidebar__eyebrow">Find your favourite</p>
                  <h2 id="filters-title">Filter cakes</h2>
                </div>
                <button id="clear-filters" class="clear-filters" type="button" hidden>Clear all</button>
              </div>

              <div class="filter-group">
                <label for="product-search">Search the collection</label>
                <div class="search-wrapper input-with-icon">
                  <span class="input-icon" aria-hidden="true">
                    <svg
                      width="18"
                      height="18"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <use href="/assets/svg/icons.svg#search"></use>
                    </svg>
                  </span>
                  <input id="product-search" type="search" placeholder="e.g. chocolate" autocomplete="off" />
                </div>
              </div>

              <div class="filter-group">
                <h3>Categories</h3>
                <div id="category-list" class="category-list" aria-label="Product categories"></div>
              </div>

              <div class="filter-group">
                <label for="product-sort">Sort by</label>
                <div class="sort-wrapper">
                  <select id="product-sort">
                    <option value="">Recommended</option>
                    <option value="name">Name</option>
                    <option value="price-asc">Price: low to high</option>
                    <option value="price-desc">Price: high to low</option>
                  </select>
                </div>
              </div>
            </aside>

            <section id="products" class="catalogue-results" aria-labelledby="products-title">
              <header class="results-header">
                <div>
                  <p class="results-header__eyebrow">Handcrafted for every occasion</p>
                  <h2 id="products-title">All cakes</h2>
                </div>
                <p id="results-count" class="results-count" aria-live="polite"></p>
              </header>
              <ul id="product-list" class="product-list"></ul>
              <nav id="pagination" class="pagination" aria-label="Product pages" hidden></nav>
            </section>
          </div>
        </div>
      </section>
      <div id="site-custom-cake-modal"></div>
      <div id="site-account-modal"></div>
      <div id="site-footer"></div>
    </main>

    <div id="toast-container"></div>

    <script type="module" src="/js/layout.js"></script>
    <script type="module" src="/js/newsletter.js"></script>
    <script type="module" src="/js/cart.js"></script>
    <script type="module" src="/js/accountModal.js"></script>
    <script type="module" src="/js/products.js"></script>
    <script type="module" src="/js/overlay.js"></script>
  </body>
</html>
