<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Home Cake</title>
    <meta name="description" content="Choose a new password for your Home Cake account." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="checkout-page">
    <header class="checkout-header">
      <a href="/" class="brand-logo" aria-label="Home Cake home">
        <img src="/assets/images/logo.webp" alt="Home Cake" />
      </a>
    </header>

    <main class="checkout-main container">
      <div class="reset-password-card">
        <h1>Choose a new password</h1>

        <p id="reset-password-error" hidden></p>
        <p id="reset-password-invalid" hidden></p>

        <form id="reset-password-form" novalidate>
          <div class="form-group">
            <label for="new-password">New password</label>
            <input
              id="new-password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
            <span class="form-hint">At least 8 characters.</span>
          </div>

          <button type="submit" class="submit-account">Update Password</button>
        </form>

        <div id="reset-password-success" class="reset-password-success" hidden>
          <h2>Password updated!</h2>
          <p>You're all set — you can now continue shopping.</p>
          <a href="/shop/all" class="pay-button">Continue shopping</a>
        </div>
      </div>
    </main>

    <script type="module" src="/js/resetPassword.js"></script>
  </body>
</html>
