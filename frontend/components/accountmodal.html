<div class="account-modal modal-custom" id="account-modal" hidden>
  <div class="account-modal-backdrop" data-account-close></div>

  <div
    class="account-modal-container modal-content"
    role="dialog"
    aria-modal="true"
    aria-labelledby="account-modal-title"
  >
    <button class="account-modal-close" id="account-modal-close" type="button" aria-label="Close">×</button>

    <div class="account-modal-tabs" role="tablist" aria-label="Account access">
      <button
        type="button"
        class="account-modal-tab is-active"
        id="account-tab-login"
        role="tab"
        aria-selected="true"
        aria-controls="account-view-login"
        data-account-view="login"
      >
        Log In
      </button>
      <button
        type="button"
        class="account-modal-tab"
        id="account-tab-register"
        role="tab"
        aria-selected="false"
        aria-controls="account-view-register"
        data-account-view="register"
      >
        Create Account
      </button>
    </div>

    <p id="account-modal-error" hidden></p>

    <!-- Log in -->
    <form
      id="account-view-login"
      class="account-modal-view is-active"
      role="tabpanel"
      aria-labelledby="account-tab-login"
      novalidate
    >
      <h2 id="account-modal-title" class="sr-only">Log in to your account</h2>

      <div class="form-group">
        <label for="login-email">Email</label>
        <div class="form-group__input-wrapper">
          <svg
            class="form-group__icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          ><use href="/assets/svg/icons.svg#email"></use></svg>
          <input
            id="login-email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <div class="form-group__input-wrapper">
          <svg
            class="form-group__icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          ><use href="/assets/svg/icons.svg#lock"></use></svg>
          <input
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Your password"
            required
          />
        </div>
      </div>

      <button type="button" class="account-modal-link" data-account-view="forgot-password">
        Forgot your password?
      </button>

      <button type="submit" class="submit-account">Log In</button>
    </form>

    <!-- Register -->
    <form
      id="account-view-register"
      class="account-modal-view"
      role="tabpanel"
      aria-labelledby="account-tab-register"
      hidden
      novalidate
    >
      <div class="form-group">
        <label for="register-name">Name</label>
        <div class="form-group__input-wrapper">
          <svg
            class="form-group__icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          ><use href="/assets/svg/icons.svg#user"></use></svg>
          <input id="register-name" name="name" type="text" autocomplete="name" placeholder="Your full name" required />
        </div>
      </div>

      <div class="form-group">
        <label for="register-email">Email</label>
        <div class="form-group__input-wrapper">
          <svg
            class="form-group__icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          ><use href="/assets/svg/icons.svg#email"></use></svg>
          <input
            id="register-email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="register-password">Password</label>
        <div class="form-group__input-wrapper">
          <svg
            class="form-group__icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          ><use href="/assets/svg/icons.svg#lock"></use></svg>
          <input
            id="register-password"
            name="password"
            type="password"
            autocomplete="new-password"
            placeholder="Create a password"
            minlength="8"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="register-password-confirm">Confirm Password</label>
        <div class="form-group__input-wrapper">
          <svg
            class="form-group__icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          ><use href="/assets/svg/icons.svg#lock"></use></svg>
          <input
            id="register-password-confirm"
            name="passwordConfirm"
            type="password"
            autocomplete="new-password"
            placeholder="Re-enter your password"
            minlength="8"
            required
          />
        </div>
      </div>

      <ul class="password-requirements" id="password-requirements">
        <li data-requirement="length">
          <span class="password-requirements__icon" aria-hidden="true"></span>
          At least 8 characters
        </li>
        <li data-requirement="match">
          <span class="password-requirements__icon" aria-hidden="true"></span>
          Passwords match
        </li>
      </ul>

      <button type="submit" class="submit-account">Create Account</button>
    </form>

    <!-- Forgot password (request link) -->
    <div id="account-view-forgot-password" class="account-modal-view" hidden>
      <h2 id="account-forgot-title" class="account-modal-view-title">Reset your password</h2>
      <p class="account-modal-view-copy">Enter your account email and we'll send you a link to reset your password.</p>

      <form id="forgot-password-form" novalidate>
        <div class="form-group">
          <label for="forgot-email">Email</label>
          <div class="form-group__input-wrapper">
            <svg
              class="form-group__icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            ><use href="/assets/svg/icons.svg#email"></use></svg>
            <input
              id="forgot-email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            />
          </div>
        </div>

        <button type="submit" class="submit-account">Send Reset Link</button>
      </form>

      <button type="button" class="account-modal-link" data-account-view="login">Back to log in</button>
    </div>

    <!-- Confirmation after requesting a reset link -->
    <div id="account-view-forgot-sent" class="account-modal-view" hidden>
      <h2 class="account-modal-view-title">Check your email</h2>
      <p class="account-modal-view-copy" id="account-forgot-sent-copy">
        We've sent a link to reset your password. It expires in 1 hour.
      </p>

      <button type="button" class="submit-account" data-account-view="login">Back to log in</button>
    </div>
  </div>
</div>
